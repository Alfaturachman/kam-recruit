    /* Apple HIG Smooth Transitions */
    .apple-glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Print Stylesheet for Dossier Pelamar */
    @media print {
      body * {
        visibility: hidden;
      }

      #modal-candidate,
      #modal-candidate * {
        visibility: visible;
      }

      #modal-candidate {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        background: white;
        padding: 0;
        margin: 0;
        z-index: 99999;
      }

      .modal-dialog-content {
        max-height: none !important;
        overflow: visible !important;
        border: none !important;
        box-shadow: none !important;
        width: 100% !important;
      }

      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
