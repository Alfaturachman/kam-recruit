<!-- 1. TOP BAR NAVIGATION -->
<!-- ============================================================== -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">

    <!-- Brand & Company Identity -->
    <div class="flex items-center space-x-2.5 sm:space-x-3 min-w-0">
      <!-- PT KAM Red & Blue Logo Mark -->
      <div
        class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-blue-900 via-blue-800 to-red-600 flex items-center justify-center text-white font-extrabold text-xs sm:text-sm tracking-wider shadow-sm shrink-0">
        KAM
      </div>
      <div class="min-w-0">
        <div class="flex items-center space-x-1.5 sm:space-x-2">
          <h1 class="text-sm sm:text-base font-extrabold text-slate-900 tracking-tight leading-none whitespace-nowrap">
            KAM RECRUIT</h1>
        </div>
        <p class="text-[11px] text-slate-500 font-medium truncate sm:hidden">PT Kinarya Alihdaya Mandiri</p>
        <p class="text-xs text-slate-500 font-medium mt-0.5 hidden sm:block">Sistem Manajemen Rekrutmen PT Kinarya
          Alihdaya Mandiri</p>
      </div>
    </div>

    <!-- Center / Right Controls -->
    <div class="flex items-center space-x-2 sm:space-x-4 shrink-0">

      <!-- Live Server Time -->
      <div
        class="hidden md:flex items-center space-x-2 px-3 py-1.5 bg-slate-100 rounded-xl text-xs text-slate-600 border border-slate-200/80">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        <span>Server: <strong id="live-clock" class="text-slate-900 font-mono">14:52:10 WIB</strong></span>
      </div>

      <!-- HRD Officer Profile -->
      <div class="flex items-center space-x-2 sm:space-x-3 pl-1.5 sm:pl-2 border-l border-slate-200">
        <div class="text-right hidden sm:block">
          <div class="text-xs font-bold text-slate-900">Iing Ariesta Sari, S.Psi.</div>
          <div class="text-[11px] text-slate-500">HRD Recruitment</div>
        </div>
        <div
          class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-blue-900 to-blue-700 text-white flex items-center justify-center font-bold text-xs shadow-xs border border-blue-950/20 shrink-0">
          SR
        </div>
      </div>

      <!-- Mobile Drawer Toggle -->
      <button onclick="toggleMobileMenu()"
        class="lg:hidden p-1.5 sm:p-2 text-slate-600 hover:text-slate-900 focus:outline-none cursor-pointer"
        aria-label="Toggle navigation menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

    </div>
  </div>
</header>

<!-- ============================================================== -->
